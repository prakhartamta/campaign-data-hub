# Serves the built frontend and forwards API traffic to the backend container. The same job the
# Vite dev proxy does locally, so the browser still talks to one origin and the API needs no CORS.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # "backend" is the compose service name, which Docker's built-in DNS (127.0.0.11) resolves to
    # that container. Written as a literal in proxy_pass, nginx would look it up once at startup
    # and keep the address forever; a recreated backend comes back on a new one and every API call
    # turns into a 502. Through a variable, nginx asks the resolver again once its cache expires.
    # 1s, because each nginx worker caches separately: at 10s, one worker went on sending requests
    # to the old address for several seconds after the new backend was already answering. The
    # backend's startup ingestion takes longer than 1s, so the stale window is never visible.
    resolver 127.0.0.11 valid=1s;
    set $backend http://backend:8000;

    # No path after the port, so the request URI is passed through unchanged: /api/v1/metrics
    # arrives at the backend as /api/v1/metrics.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The Swagger UI and the schema it loads, so the API docs live on the same port as the app.
    location /docs {
        proxy_pass $backend;
    }

    location = /openapi.json {
        proxy_pass $backend;
    }

    # /campaigns and /health exist only in React Router, not as files on disk. Any path that is not
    # a real file gets index.html, and the router renders the page from the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
