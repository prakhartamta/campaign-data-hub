# The whole app with one command:
#   docker compose up --build
# then open http://localhost:8080 for the app, or http://localhost:8080/docs for the API.
#
# Only the frontend publishes a port. nginx forwards /api and /docs to the backend over the compose
# network, so the backend needs no host port and cannot clash with a local dev server on 8000.
services:
  backend:
    build: ./backend
    volumes:
      # Read-only: the pipeline reads deliveries and never writes them. Mounted rather than baked
      # into the image, so a file dropped into data/deliveries is picked up by the next "Run
      # ingestion" without a rebuild.
      - ./data:/data:ro
    # No volume for the database. The container ingests on every start and the pipeline is a full
    # recompute, so the metrics are rebuilt either way; only the ingestion_runs history is lost on
    # `docker compose down`. To keep it, mount a named volume at /db.
    healthcheck:
      # Healthy means uvicorn is answering, which only happens after startup ingestion finished.
      # The image has no curl, so the probe uses the Python that is already in it.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        # Healthy rather than started: the backend ingests before it listens, so "started" would
        # let the first page load reach an API that is not up yet and get a 502.
        condition: service_healthy
